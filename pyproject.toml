[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic_memory"
version = "0.2.0"
description = "A lightweight, pluggable long-term agentic memory engine for LLM personalization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
local = [
    "lancedb>=0.6.0",
    "fastembed>=0.2.0",
    "pandas>=2.0.0",
    "ollama>=0.1.0",
    "pyarrow>=14.0.0"
]
openai = [
    "openai>=1.0.0"
]
mariadb = [
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0"
]
all = [
    "agentic_memory[local,openai,mariadb]"
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0"
]
simulation = [
    "httpx>=0.24.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0"
]

[project.scripts]
agentic-memory = "agentic_memory.cli:main"

[tool.setuptools]
# Two roots: the engine package lives at the repo root, the simulation
# subsystem lives under src/ (see docs/SIMULATION_SYSTEM_DESIGN.md).
packages = ["agentic_memory", "simulation"]

[tool.setuptools.package-dir]
"" = "."
"simulation" = "src/simulation"
