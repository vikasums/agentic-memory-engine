[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic_memory"
version = "0.1.0"
description = "A lightweight, vector-based agentic memory engine for long-term user personalization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "lancedb>=0.6.0",
    "fastembed>=0.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "ollama>=0.1.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_memory*"]
