[pytest]
# Pytest configuration for agentic memory simulation system.

# Add src/ to pythonpath so tests can import simulation modules directly.
# Without this, tests need sys.path boilerplate:
#   sys.path.insert(0, os.path.join(os.path.dirname(__file__), "src"))
#
# With this, tests can:
#   from simulation import SimulationRunner, ScenarioGenerator, ...
pythonpath = src

# Async test support (pytest-asyncio)
asyncio_mode = auto

# Verbose output on test failures
addopts = -v --tb=short

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (database, API mocks)
    unit: marks tests as unit tests
